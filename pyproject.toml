[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aitraffic"
version = "2.0.0"
description = "Autonomous Multi-Modal Traffic Signal Optimization & Telemetry Platform"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Thimuth", email = "thimuthexe@gmail.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
    "pygame>=2.5.0",
    "torch>=2.0.0",
    "scikit-learn>=1.3.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "websockets>=11.0",
    "ultralytics>=8.0.0",
    "opencv-python>=4.8.0",
    "joblib>=1.3.0",
    "httpx>=0.24.0",
    "httpx2>=2.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "httpx>=0.24.0",
    "httpx2>=2.0.0"
]

[project.scripts]
aitraffic = "aitraffic.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
